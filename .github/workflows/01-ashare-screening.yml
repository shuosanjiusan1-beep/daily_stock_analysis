name: A股每日自动选股

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ashare-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 下载代码
        uses: actions/checkout@v5

      - name: 设置Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install alphasift

      - name: A股全市场选股
        run: |
          alphasift screen balanced_alpha --no-llm --save-run
          alphasift screen capital_heat --no-llm --save-run
          alphasift runs --json > runs.json

          python - <<'PY'
          import json
          import subprocess
          import re
          import os

          data = json.load(open("runs.json"))
          runs = data if isinstance(data, list) else data.get("runs", [])
          codes = []

          for run in runs[:2]:
              report = json.loads(subprocess.check_output(
                  ["alphasift", "report", run["run_id"], "--json"],
                  text=True
              ))
              for pick in report.get("top_picks", []):
                  code = str(pick.get("code", ""))
                  if re.fullmatch(r"\d{6}", code) and code not in codes:
                      codes.append(code)

          codes = codes[:10]
          if not codes:
              raise RuntimeError("未筛选出有效股票")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("ASHARE_CODES=" + ",".join(codes) + "\n")

          print("今日候选股票:", codes)
          PY

      - name: AI深度分析及邮件发送
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          SCREENING_ENABLED: 'true'
          GEMINI_REQUEST_DELAY: '5.0'
        run: |
          mkdir -p data logs reports
          python main.py --stocks "$ASHARE_CODES" --no-market-review

      - name: 保存分析报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ashare-analysis-report
          path: |
            reports/
            logs/
            runs.json
          retention-days: 7
